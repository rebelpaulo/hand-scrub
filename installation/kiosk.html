<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Palco de Luz · Escolhe uma experiência</title>
  <link rel="stylesheet" href="/installation/surfaces.css">
  <link rel="stylesheet" href="/installation/kiosk.css">
  <script type="module" src="/installation/kiosk.js"></script>
</head>
<body class="kiosk">
  <div class="shell">
    <header>
      <div class="mark"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M18 2v32M2 18h32M7 7l22 22m0-22L7 29" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="10" stroke="currentColor"/></svg>PALCO DE LUZ</div>
      <div class="kiosk-header-status">
        <span class="kiosk-label" id="room-label"></span>
        <p class="status" id="projection-status" role="status">A procurar projeção…</p>
      </div>
    </header>
    <main>
      <div class="intro kiosk-intro">
        <div>
          <p class="tag"><span aria-hidden="true">✳</span> Instalação interativa</p>
          <h1>O que vamos <em>fazer?</em></h1>
          <p id="welcome">Escolhe uma experiência e vê o que acontece na projeção.</p>
        </div>
        <ol class="kiosk-steps" aria-label="Como funciona">
          <li><span aria-hidden="true">01</span> Escolhe</li>
          <li><span aria-hidden="true">02</span> Olha</li>
          <li><span aria-hidden="true">03</span> Joga</li>
        </ol>
      </div>
      <aside class="notice" id="session-banner" hidden>
        <p id="session-banner-text"></p>
        <button class="action" type="button" id="view-session">Ver sessão</button>
      </aside>
      <section aria-labelledby="gallery-title">
        <div class="kiosk-section">
          <h2 class="kiosk-label" id="gallery-title">Experiências</h2>
          <span class="kiosk-label" id="gallery-count" aria-hidden="true"></span>
        </div>
        <div class="grid" id="gallery"></div>
      </section>
      <noscript>Ativa JavaScript para escolher uma experiência.</noscript>
    </main>
    <footer>
      <span>Palco de Luz · Instalação interativa</span>
      <a id="operator-link" class="utility-link" href="/installation/admin.html">Área da equipa</a>
    </footer>
  </div>

  <dialog id="experience" aria-labelledby="experience-title">
    <div class="detail">
      <span class="art" id="experience-art"><img id="preview" alt=""></span>
      <section class="gesture-lesson" id="gesture-lesson" aria-label="Como fazer os dois gestos" hidden>
        <figure class="gesture-card gesture-fire">
          <svg viewBox="0 0 160 96" aria-hidden="true">
            <path class="gesture-grid" d="M16 48h128M80 8v80"/>
            <path class="gesture-hand" d="M73 89l-1-12c-13-6-18-15-20-26l-5-17c-2-6 4-9 8-4l11 12 3-20c1-5 7-4 8 1l2 26 6-14c2-5 8-3 8 2l-3 17 7-7c5-4 10 0 8 5l-9 18c-3 5-7 7-12 9v10"/>
            <path class="snap-tip" d="M62 52q10-13 22-10q6 1 5 6q-1 4-7 5l-9 5"/>
            <path class="fire-effect" d="M103 62c-7-7-8-15 0-23 0 6 3 9 5 9 0-8 7-13 7-21 9 8 14 16 12 24 5-3 7-8 7-11 8 9 6 19 0 24-9 9-25 8-31-2Z"/>
            <path class="fire-core" d="M115 65q-8-6 3-18 0 8 5 10 3-1 5-6 6 12-3 15Z"/>
          </svg>
          <figcaption><strong>01 · Fogo</strong><span>Estala com o polegar e o dedo médio.</span></figcaption>
        </figure>
        <figure class="gesture-card gesture-electric">
          <svg viewBox="0 0 160 96" aria-hidden="true">
            <path class="gesture-grid" d="M16 48h128M80 8v80"/>
            <path class="gesture-hand index-left" d="M13 85l9-19-1-13c0-4 2-7 5-9l24-8c4-1 7 4 3 6l-17 9 13 7c6 4 7 9 2 13l-18 13"/>
            <path class="gesture-hand index-right" d="M147 16l-9 20 1 12c0 4-2 7-5 9l-24 8c-4 1-7-4-3-6l17-9-13-7c-6-4-7-9-2-13l18-13"/>
            <path class="electric-effect" d="M53 39l14 6 6-11 7 19 9-8 5 13 12 4m-26-9-5 12 7 6"/>
          </svg>
          <figcaption><strong>02 · Eletricidade</strong><span>Aponta os indicadores um para o outro.</span></figcaption>
        </figure>
      </section>
      <div class="dialog-content">
        <p id="experience-name" class="tag"></p>
        <h2 id="experience-title" tabindex="-1"></h2>
        <div class="experience-instruction" id="experience-instruction">
          <h3 class="kiosk-label">Como jogar</h3>
          <p id="experience-gesture"></p>
        </div>
        <p id="experience-status" class="experience-status" role="status"></p>
        <div id="seek-control" hidden>
          <label for="seek">Controlar o tempo no touchscreen</label>
          <input id="seek" type="range" min="0" max="100" value="0">
        </div>
        <p id="experience-error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="action primary" id="start">Começar</button>
          <a class="action primary" id="draw" hidden>Desenhar no touchscreen</a>
          <button type="button" class="action" id="end" hidden>Terminar sessão</button>
          <button type="button" class="action" id="back">Voltar</button>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
